name: Render dashboard

on:
  # PRIMARY TRIGGER: a Cloudflare Worker cron (see cron/), which calls
  # workflow_dispatch below every 15 minutes. GitHub says plainly that the
  # schedule event is best-effort, and on this repo that meant 1 of ~46 slots
  # delivered over 11.6 hours (2%), while every push and dispatch ran in
  # seconds. The clock had to move off GitHub.
  workflow_dispatch:

  push:
    branches: [main]

  schedule:
    # Kept as a dormant fallback, not relied on: it has delivered once. The
    # concurrency group below queues a duplicate instead of racing it, so the
    # occasional overlap is harmless.
    - cron: '7,22,37,52 * * * *'

# Publishing is now a git push to gh-pages, so contents: write is the only
# grant needed. pages: write, id-token: write and actions: read all belonged to
# the artifact/deploy-pages path and are gone with it.
permissions:
  contents: write

# Never let two publishes race. Each one force-pushes gh-pages, so queueing
# rather than cancelling keeps the branch's single commit coherent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install` rather than `npm ci`: the lockfile was generated on
      # darwin-arm64 and sharp resolves a different optional binary per platform.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Locate Chrome
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$BIN" ]; then
            echo "::error::No Chrome on the runner image; render.js cannot screenshot."
            exit 1
          fi
          echo "CHROME_BIN=$BIN" >> "$GITHUB_ENV"
          echo "using $BIN ($("$BIN" --version))"

      # If the worker is unreachable render.js exits non-zero and this job fails,
      # which leaves the PREVIOUS Pages deployment live. A stale dashboard that
      # says it is stale beats replacing it with a broken one.
      - name: Render
        run: node render.js

      - name: Summarise
        run: |
          ls -la out/
          echo '### Rendered' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out/dashboard.json >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # PUBLISH. Pages serves the gh-pages branch directly (Settings > Pages,
      # source = gh-pages), so publishing is a git push and nothing else.
      #
      # This replaces upload-pages-artifact + deploy-pages, which failed on
      # GitHub's artifact service: deploy-pages looks the artifact up through
      # the Twirp ListArtifacts endpoint, and on 24 Nov 2026 that endpoint began
      # returning "Found 0 artifact(s)" for ~14% of runs, minutes after the
      # upload reported success. A previous fix polled the REST artifacts API
      # until the artifact appeared; it worked for 451 consecutive runs and then
      # stopped helping, because the two endpoints are different services -- the
      # REST one listed the artifact while deploy-pages still saw none 0.7 s
      # later. No amount of waiting fixes a read that is already succeeding.
      #
      # A push has no such handover. The artifact service is simply not in the
      # path any more.
      #
      # `git init` inside out/ each run means the branch is always exactly one
      # commit: no history, no growth, nothing to prune. The force-push is
      # therefore not destructive of anything we want to keep.
      #
      # THE RETRY IS NOT THE SAME MISTAKE AS THE LAST ONE. The artifact wait
      # that preceded this step was useless because the read it waited on was
      # already succeeding -- a different service was failing. Here the write
      # itself returns `remote: Internal Server Error` and the ref genuinely
      # does not move: on 24 Nov 2026 three pushes failed that way (18:30,
      # 22:30, 23:30 UTC) and GitHub recorded no Pages build at any of those
      # times, while every other quarter-hour built normally. No GitHub
      # incident covered it. Retrying is correct because the push is
      # idempotent: the commit object already exists locally, so every attempt
      # offers the identical SHA, and a push that did land server-side but
      # reported 500 simply reports "Everything up-to-date" and exits 0.
      #
      # Four attempts at ~9% observed failure give roughly one failed publish
      # per 15,000 runs. The delays lengthen so a brief backend wobble and a
      # longer one are both covered; worst case adds 65 s to a ~25 s job.
      - name: Publish to gh-pages
        run: |
          touch out/.nojekyll   # serve the files as-is; skip Jekyll processing
          cd out
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Render $(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
                        -m "Published by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}."

          SHA="$(git rev-parse --short HEAD)"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ATTEMPT=0

          # A failing command inside `if` is exempt from `bash -e`, so the loop
          # survives a rejected push and only the explicit exits end the step.
          for delay in 5 15 45 0; do
            ATTEMPT=$((ATTEMPT + 1))
            if git push -q --force "$REMOTE" gh-pages:gh-pages; then
              echo "pushed $SHA to gh-pages on attempt $ATTEMPT"
              exit 0
            fi
            if [ "$delay" = 0 ]; then break; fi
            echo "push rejected; retrying in ${delay}s"
            sleep "$delay"
          done

          echo "::error::$ATTEMPT pushes to gh-pages were rejected; the previous render stays live."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}
