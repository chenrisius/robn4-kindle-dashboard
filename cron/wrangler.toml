name = "robn4-dashboard-cron"
main = "worker.js"
compatibility_date = "2026-11-01"

# The workers.dev URL is wanted: it serves the health page. Preview URLs are
# not — each deployed version would get its own public URL, and one public
# endpoint is enough for a Worker that holds a token.
workers_dev  = true
preview_urls = false

# Cloudflare cron triggers are delivered on schedule, which is the entire
# reason this Worker exists. On the quarter-hour is fine here: unlike GitHub,
# Cloudflare does not drop the contended slots.
[triggers]
crons = ["*/15 * * * *"]

[vars]
GITHUB_REPO   = "chenrisius/robn4-kindle-dashboard"
WORKFLOW_FILE = "render.yml"
GIT_REF       = "main"
DASHBOARD_URL = "https://chenrisius.github.io/robn4-kindle-dashboard"

# GITHUB_TOKEN is NOT here. It is a secret, set once with
#   npm run secret
# so the value lives in Cloudflare and never in this repo. Use the script, not
# the bare wrangler command: the name has to be the argument and the token the
# prompted value, and getting that backwards leaks the token into a secret NAME,
# which is visible everywhere.

# The health page is useful; observability costs nothing and makes a silent
# failure visible in one request.
[observability]
enabled = true
